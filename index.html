<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#080814">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Neon Dodge</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #080814;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    color: #fff;
    touch-action: none;
    overscroll-behavior: none;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }

  /* ---------- HUD ---------- */
  #hud {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: max(16px, env(safe-area-inset-top)) 20px 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    z-index: 5;
    transition: opacity .25s;
  }
  #hud.hidden { opacity: 0; }
  #score {
    font-size: 34px;
    font-weight: 800;
    letter-spacing: 1px;
    color: #fff;
    text-shadow: 0 0 18px rgba(0, 229, 255, .8), 0 0 40px rgba(0, 229, 255, .35);
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  #lives { display: flex; gap: 7px; padding-top: 8px; }
  .life {
    width: 13px; height: 13px;
    border-radius: 50%;
    background: #ff3b5c;
    box-shadow: 0 0 12px rgba(255, 59, 92, .9), 0 0 24px rgba(255, 59, 92, .4);
    animation: pop .3s cubic-bezier(.2, 1.6, .5, 1);
  }
  @keyframes pop {
    from { transform: scale(0); }
    to   { transform: scale(1); }
  }

  /* ---------- Оверлеи ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    text-align: center;
    padding: 28px;
    z-index: 10;
    background: radial-gradient(circle at 50% 38%, rgba(40, 25, 100, .85), rgba(8, 8, 20, .97) 70%);
    transition: opacity .3s;
  }
  .overlay.hidden { display: none; }

  .title {
    font-size: clamp(38px, 13vw, 58px);
    font-weight: 900;
    letter-spacing: 4px;
    line-height: 1;
    background: linear-gradient(135deg, #00e5ff, #7b5cff 55%, #ff4fa3);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 22px rgba(0, 229, 255, .55));
  }
  .subtitle {
    font-size: 15px;
    line-height: 1.7;
    color: #9aa4c4;
    max-width: 300px;
    font-weight: 500;
  }
  .subtitle b { color: #ffd54a; font-weight: 700; }
  .subtitle i { color: #ff3b5c; font-style: normal; font-weight: 700; }

  button {
    margin-top: 10px;
    padding: 17px 52px;
    font-size: 17px;
    font-weight: 800;
    letter-spacing: 2.5px;
    font-family: inherit;
    border: none;
    border-radius: 999px;
    color: #06101f;
    background: linear-gradient(135deg, #00e5ff, #7b5cff);
    box-shadow: 0 0 34px rgba(0, 229, 255, .5), 0 8px 30px rgba(0, 0, 0, .5);
    cursor: pointer;
    transition: transform .12s, box-shadow .2s;
    touch-action: manipulation;
  }
  button:active {
    transform: scale(.94);
    box-shadow: 0 0 20px rgba(0, 229, 255, .7);
  }

  .final-score {
    font-size: 74px;
    font-weight: 900;
    line-height: 1;
    color: #fff;
    text-shadow: 0 0 30px rgba(0, 229, 255, .75);
    font-variant-numeric: tabular-nums;
  }
  .record {
    font-size: 15px;
    color: #8b95b8;
    letter-spacing: 1.5px;
    font-weight: 600;
  }
  .record span { color: #ffd54a; }
  .gameover-title {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 3px;
    color: #ff3b5c;
    text-shadow: 0 0 24px rgba(255, 59, 92, .7);
  }
  .new-record {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 3px;
    color: #ffd54a;
    text-shadow: 0 0 16px rgba(255, 213, 74, .8);
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: .35; } }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div id="score">0</div>
  <div id="lives"></div>
</div>

<div id="menu" class="overlay">
  <div class="title">NEON<br>DODGE</div>
  <div class="subtitle">
    Веди шар пальцем<br>
    Лови <b>золотые сферы</b> · беги от <i>красных шипов</i>
  </div>
  <button id="btnPlay">ИГРАТЬ</button>
</div>

<div id="gameover" class="overlay hidden">
  <div class="gameover-title">ИГРА ОКОНЧЕНА</div>
  <div class="final-score" id="finalScore">0</div>
  <div class="new-record hidden" id="newRecord">★ НОВЫЙ РЕКОРД ★</div>
  <div class="record">РЕКОРД: <span id="bestScore">0</span></div>
  <button id="btnRetry">ЗАНОВО</button>
</div>

<script>
(() => {
  'use strict';

  // ===== Canvas =====
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    makeStars();
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 120));

  // ===== Звёзды =====
  let stars = [];
  function makeStars() {
    stars = [];
    const count = Math.round((W * H) / 16000);
    for (let i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.5 + 0.4,
        a: Math.random() * 0.45 + 0.15,
        ph: Math.random() * Math.PI * 2,
        sp: Math.random() * 1.6 + 0.6
      });
    }
  }

  // ===== Игровое состояние =====
  const STATE = { MENU: 0, PLAY: 1, OVER: 2 };
  let state = STATE.MENU;

  let player, objects, particles, trail;
  let score, lives, best;
  let spawnTimer, elapsed, fallSpeed;
  let shake, time;

  best = parseInt(localStorage.getItem('neonDodgeBest') || '0', 10) || 0;

  const hud = document.getElementById('hud');
  const scoreEl = document.getElementById('score');
  const livesEl = document.getElementById('lives');
  const menuEl = document.getElementById('menu');
  const overEl = document.getElementById('gameover');
  const finalScoreEl = document.getElementById('finalScore');
  const bestScoreEl = document.getElementById('bestScore');
  const newRecordEl = document.getElementById('newRecord');

  function reset() {
    player = { x: W / 2, y: H * 0.72, r: 15, tx: W / 2, ty: H * 0.72, invuln: 0 };
    objects = [];
    particles = [];
    trail = [];
    score = 0;
    lives = 3;
    spawnTimer = 0.55;
    elapsed = 0;
    fallSpeed = 190;
    shake = 0;
    time = 0;
    updateHUD();
  }

  function updateHUD() {
    scoreEl.textContent = score;
    livesEl.innerHTML = '';
    for (let i = 0; i < lives; i++) {
      const d = document.createElement('div');
      d.className = 'life';
      livesEl.appendChild(d);
    }
  }

  // ===== Ввод =====
  let pointerActive = false;

  function movePointer(x, y) {
    if (state !== STATE.PLAY) return;
    // Смещаем вверх, чтобы палец не закрывал шар
    const ty = y - Math.min(70, H * 0.09);
    player.tx = clamp(x, player.r, W - player.r);
    player.ty = clamp(ty, player.r + 90, H - player.r - 10);
  }

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    pointerActive = true;
    const t = e.changedTouches[0];
    movePointer(t.clientX, t.clientY);
  }, { passive: false });

  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    const t = e.changedTouches[0];
    movePointer(t.clientX, t.clientY);
  }, { passive: false });

  canvas.addEventListener('touchend', e => {
    e.preventDefault();
    pointerActive = false;
  }, { passive: false });

  canvas.addEventListener('mousedown', e => {
    pointerActive = true;
    movePointer(e.clientX, e.clientY);
  });
  canvas.addEventListener('mousemove', e => {
    if (pointerActive) movePointer(e.clientX, e.clientY);
  });
  window.addEventListener('mouseup', () => pointerActive = false);

  // ===== Спавн объектов =====
  function spawn() {
    const margin = 36;
    const x = margin + Math.random() * (W - margin * 2);
    const dangerChance = Math.min(0.56, 0.30 + elapsed * 0.0065);
    const isDanger = Math.random() < dangerChance;

    if (isDanger) {
      objects.push({
        type: 'spike',
        x, y: -45,
        r: 15,
        vx: (Math.random() - 0.5) * 70,
        vy: fallSpeed * (0.88 + Math.random() * 0.38),
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 5
      });
    } else {
      objects.push({
        type: 'orb',
        x, y: -45,
        r: 11,
        vx: (Math.random() - 0.5) * 55,
        vy: fallSpeed * (0.82 + Math.random() * 0.35),
        rot: 0,
        vr: 0
      });
    }
  }

  // ===== Частицы =====
  function burst(x, y, color, count, power) {
    power = power || 1;
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = (40 + Math.random() * 190) * power;
      particles.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 1,
        decay: 1.4 + Math.random() * 1.4,
        r: 1.5 + Math.random() * 3,
        color
      });
    }
  }

  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.94;
      p.vy *= 0.94;
      p.vy += 120 * dt;
      p.life -= p.decay * dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  // ===== Обновление =====
  function update(dt) {
    time += dt;
    updateParticles(dt);

    if (shake > 0) shake = Math.max(0, shake - dt * 55);

    if (state !== STATE.PLAY) return;

    elapsed += dt;

    // Сложность
    const spawnInterval = Math.max(0.27, 0.92 - elapsed * 0.0135);
    fallSpeed = 190 + elapsed * 9;

    // Плавное движение игрока
    const k = Math.min(1, dt * 17);
    player.x += (player.tx - player.x) * k;
    player.y += (player.ty - player.y) * k;
    if (player.invuln > 0) player.invuln -= dt;

    // След
    trail.push({ x: player.x, y: player.y });
    if (trail.length > 13) trail.shift();

    // Спавн
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawn();
      spawnTimer = spawnInterval * (0.72 + Math.random() * 0.62);
    }

    // Объекты
    for (let i = objects.length - 1; i >= 0; i--) {
      const o = objects[i];
      o.x += o.vx * dt;
      o.y += o.vy * dt;
      o.rot += o.vr * dt;

      // Отскок от стен
      if (o.x < o.r) { o.x = o.r; o.vx = Math.abs(o.vx); }
      if (o.x > W - o.r) { o.x = W - o.r; o.vx = -Math.abs(o.vx); }

      if (o.y > H + 70) { objects.splice(i, 1); continue; }

      // Коллизия
      const dx = o.x - player.x;
      const dy = o.y - player.y;
      const rr = o.r + player.r;
      if (dx * dx + dy * dy < rr * rr) {
        if (o.type === 'orb') {
          score += 10;
          burst(o.x, o.y, '#ffd54a', 12, 0.8);
          objects.splice(i, 1);
          updateHUD();
          if (navigator.vibrate) navigator.vibrate(12);
        } else if (player.invuln <= 0) {
          lives--;
          player.invuln = 1.6;
          shake = 16;
          burst(o.x, o.y, '#ff3b5c', 22, 1.2);
          objects.splice(i, 1);
          updateHUD();
          if (navigator.vibrate) navigator.vibrate([35, 40, 70]);
          if (lives <= 0) { gameOver(); return; }
        }
      }
    }
  }

  // ===== Отрисовка =====
  function drawBackground() {
    const g = ctx.createRadialGradient(W / 2, H * 0.35, 0, W / 2, H * 0.35, Math.max(W, H) * 0.85);
    g.addColorStop(0, '#141233');
    g.addColorStop(0.55, '#0c0b22');
    g.addColorStop(1, '#05050f');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // Звёзды
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      const tw = 0.65 + Math.sin(time * s.sp + s.ph) * 0.35;
      ctx.globalAlpha = s.a * tw;
      ctx.fillStyle = '#bcd8ff';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawPlayer() {
    const p = player;
    const blink = p.invuln > 0 && Math.floor(p.invuln * 14) % 2 === 0;
    if (blink) return;

    // След
    for (let i = 0; i < trail.length; i++) {
      const t = trail[i];
      const f = i / trail.length;
      ctx.globalAlpha = f * 0.28;
      ctx.fillStyle = '#00e5ff';
      ctx.beginPath();
      ctx.arc(t.x, t.y, p.r * f * 0.85, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Внешнее свечение
    const pulse = 1 + Math.sin(time * 6) * 0.06;
    const gr = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 4.2 * pulse);
    gr.addColorStop(0, 'rgba(0, 229, 255, 0.45)');
    gr.addColorStop(0.45, 'rgba(0, 229, 255, 0.14)');
    gr.addColorStop(1, 'rgba(0, 229, 255, 0)');
    ctx.fillStyle = gr;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * 4.2 * pulse, 0, Math.PI * 2);
    ctx.fill();

    // Ядро
    ctx.shadowColor = '#00e5ff';
    ctx.shadowBlur = 22;
    ctx.fillStyle = '#8ff6ff';
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(p.x - p.r * 0.28, p.y - p.r * 0.28, p.r * 0.42, 0, Math.PI * 2);
    ctx.fill();

    // Кольцо неуязвимости
    if (p.invuln > 0) {
      ctx.strokeStyle = 'rgba(0, 229, 255, ' + (0.35 + Math.sin(time * 22) * 0.3) + ')';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r + 11, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  function drawObjects() {
    for (let i = 0; i < objects.length; i++) {
      const o = objects[i];

      if (o.type === 'orb') {
        // Свечение
        const gr = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, o.r * 3.4);
        gr.addColorStop(0, 'rgba(255, 213, 74, 0.55)');
        gr.addColorStop(0.5, 'rgba(255, 160, 40, 0.16)');
        gr.addColorStop(1, 'rgba(255, 213, 74, 0)');
        ctx.fillStyle = gr;
        ctx.beginPath();
        ctx.arc(o.x, o.y, o.r * 3.4, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowColor = '#ffd54a';
        ctx.shadowBlur = 16;
        ctx.fillStyle = '#ffd54a';
        ctx.beginPath();
        ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.fillStyle = '#fff6d0';
        ctx.beginPath();
        ctx.arc(o.x - o.r * 0.3, o.y - o.r * 0.3, o.r * 0.42, 0, Math.PI * 2);
        ctx.fill();

      } else {
        // Красный шип (вращающийся ромб)
        const gr = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, o.r * 3.6);
        gr.addColorStop(0, 'rgba(255, 59, 92, 0.5)');
        gr.addColorStop(0.5, 'rgba(255, 59, 92, 0.13)');
        gr.addColorStop(1, 'rgba(255, 59, 92, 0)');
        ctx.fillStyle = gr;
        ctx.beginPath();
        ctx.arc(o.x, o.y, o.r * 3.6, 0, Math.PI * 2);
        ctx.fill();

        ctx.save();
        ctx.translate(o.x, o.y);
        ctx.rotate(o.rot);
        ctx.shadowColor = '#ff3b5c';
        ctx.shadowBlur = 18;
        ctx.fillStyle = '#ff3b5c';
        ctx.beginPath();
        const R = o.r * 1.35;
        ctx.moveTo(0, -R);
        ctx.lineTo(R * 0.82, 0);
        ctx.lineTo(0, R);
        ctx.lineTo(-R * 0.82, 0);
        ctx.closePath();
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.fillStyle = '#ffb3c2';
        ctx.beginPath();
        ctx.moveTo(0, -R * 0.45);
        ctx.lineTo(R * 0.36, 0);
        ctx.lineTo(0, R * 0.45);
        ctx.lineTo(-R * 0.36, 0);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
    }
  }

  function drawParticles() {
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function render() {
    drawBackground();

    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }

    if (state === STATE.PLAY || state === STATE.OVER) {
      drawObjects();
      if (state === STATE.PLAY) drawPlayer();
    }
    drawParticles();

    ctx.restore();
  }

  // ===== Игровой цикл =====
  let lastTime = 0;

  function loop(now) {
    if (!lastTime) lastTime = now;
    let dt = (now - lastTime) / 1000;
    lastTime = now;
    if (dt > 0.05) dt = 0.05; // защита от скачков

    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  // ===== Управление состояниями =====
  function startGame() {
    reset();
    state = STATE.PLAY;
    menuEl.classList.add('hidden');
    overEl.classList.add('hidden');
    hud.classList.remove('hidden');
    lastTime = 0;
  }

  function gameOver() {
    state = STATE.OVER;
    hud.classList.add('hidden');

    const isRecord = score > best;
    if (isRecord) {
      best = score;
      localStorage.setItem('neonDodgeBest', String(best));
    }

    finalScoreEl.textContent = score;
    bestScoreEl.textContent = best;
    newRecordEl.classList.toggle('hidden', !isRecord);

    // Финальный взрыв
    burst(player.x, player.y, '#00e5ff', 30, 1.6);
    burst(player.x, player.y, '#ffffff', 14, 1.1);
    shake = 22;

    setTimeout(() => {
      overEl.classList.remove('hidden');
    }, 420);
  }

  document.getElementById('btnPlay').addEventListener('click', startGame);
  document.getElementById('btnRetry').addEventListener('click', startGame);

  // Блокируем контекстное меню и зум
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });

  // ===== Запуск =====
  resize();
  reset();
  state = STATE.MENU;
  bestScoreEl.textContent = best;
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
